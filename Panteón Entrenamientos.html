<style>
/* Layout: app de una columna (máx 560px); listado de dioses → ficha → pantalla de entreno a pantalla completa. Look oscuro fijo, de gimnasio. */
:root{
  color-scheme: dark;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#232B3D;
  --bg:#0C1019; --surface:#151B27; --surface2:#1D2534; --line:#29324A;
  --fg:#EEF1F7; --muted:#8B96AD; --faint:#5A6580;
  --accent:#4D7CFF; --accent-hi:#7FA2FF; --accent-ink:#FFFFFF;
  --lv0:#58D39B; --lv1:#F2B544; --lv2:#FF6D5E;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --num:"Barlow Condensed", "Arial Narrow", sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;letter-spacing:.01em;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.store{font-size:11px;color:var(--faint);text-align:right;letter-spacing:.04em}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:999px;padding:4px;margin-bottom:16px}
.tabs button{padding:10px 0;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);letter-spacing:.02em}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Workout cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;background:var(--surface);border-radius:var(--r);padding:16px 16px 14px;position:relative;overflow:hidden;width:100%}
.card:hover{background:var(--surface2)}
.card .name{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.lvl{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.02em;vertical-align:middle;margin-left:6px}
.card .scheme{font-size:13px;color:var(--muted);font-weight:500;grid-column:1}
.card .ex{grid-column:1/-1;font-size:13px;color:var(--faint);margin-top:6px;min-width:0}
.card .pb{grid-row:1/3;grid-column:2;text-align:right;align-self:center}
.pb .t{font-family:var(--num);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.pb .l{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600}
.pb .none{font-size:12px;color:var(--faint)}
.stripe{position:absolute;left:0;top:0;bottom:0;width:4px}

/* Sheet (ficha) */
.overlay{position:fixed;inset:0;background:rgba(5,8,14,.72);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:900;font-size:54px;line-height:.9;margin:0;text-transform:uppercase}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 18px;color:var(--muted);font-size:14px}
.meta b{color:var(--fg);font-weight:600}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.round{background:var(--surface2);border-radius:10px;padding:10px 12px}
.round h4{margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.round div{font-size:14px;display:flex;justify-content:space-between;gap:8px}
.round div span:first-child{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;min-width:32px}
.round div span:last-child{flex:1}
.rest{color:var(--accent-hi)}
.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.rec{border:1px solid var(--line);border-radius:10px;padding:10px}
.rec .l{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600}
.rec .v{font-family:var(--num);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.rec .d{font-size:11px;color:var(--faint)}
.btn{display:block;width:100%;padding:17px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);margin-top:10px}
.btn.danger{background:var(--lv2)}

/* Runner */
.run{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.run-in{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.run-top .wname{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.iconbtn{padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.segs{display:flex;gap:10px;margin:14px 0 6px}
.segs .rg{flex:var(--n);display:flex;gap:3px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs i.done{background:var(--accent)}
.segs i.now{background:var(--fg)}
.clock{font-family:var(--num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;justify-content:space-between}
.clock b{color:var(--fg);font-weight:700}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0;gap:6px}
.stage .round-l{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.reps{font-family:var(--display);font-weight:900;font-size:clamp(84px,24vw,150px);line-height:.82;font-variant-numeric:tabular-nums}
.fig{width:min(46vw,26vh,210px);aspect-ratio:1;max-width:100%;background:var(--surface);border-radius:20px;margin-bottom:8px}
.fig svg{display:block;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;white-space:nowrap;animation:up .2s ease-out}
.exn{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:.95;text-transform:uppercase;text-wrap:balance}
.stage.is-rest .reps{color:var(--accent-hi)}
.flash{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:.3}to{transform:none;opacity:1}}
.next{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.next .l{font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:600}
.next .v{font-weight:600}
.big{padding:22px;font-size:20px}
.row{display:flex;gap:10px;margin-top:10px}
.row .btn{margin:0;padding:13px;font-size:13px}
.count{font-family:var(--display);font-weight:900;font-size:min(60vw,320px);line-height:1;color:var(--accent)}

/* Finish */
.fin h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
.fin .total{font-family:var(--num);font-weight:700;font-size:clamp(72px,24vw,120px);line-height:.9;font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.04em}
.badge.good{background:color-mix(in srgb,var(--lv0) 18%,transparent);color:var(--lv0)}
.badge.bad{background:color-mix(in srgb,var(--lv1) 16%,transparent);color:var(--lv1)}
.bars{display:flex;flex-direction:column;gap:8px;margin:20px 0}
.bar{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .tv{font-family:var(--num);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* History */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--surface);border-radius:12px;padding:12px}
.stat .v{font-family:var(--num);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted)}
.sec{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 10px}
.wh{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.wh .n{min-width:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.wh .s{font-size:13px;color:var(--muted);grid-column:1/-1}
.wh .s b{color:var(--fg);font-weight:600}
.wh svg{display:block}
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.entry .date{font-size:12px;color:var(--muted);width:62px;line-height:1.2}
.entry .date b{display:block;color:var(--fg);font-size:15px;font-weight:600}
.entry .en{font-weight:600}
.entry .delta{font-size:12px;color:var(--muted)}
.entry .tm{font-family:var(--num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.crown{color:var(--lv1);font-size:11px;font-weight:700;letter-spacing:.08em}
.del{color:var(--faint);font-size:12px;padding:6px}
.del:hover{color:var(--lv2)}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-size:28px;color:var(--fg);text-transform:uppercase;margin-bottom:6px}
.chartbox{background:var(--surface);border-radius:var(--r);padding:16px 14px 12px;position:relative}
.chartbox .head{font-size:14px;color:var(--muted);margin:0 2px 10px;min-width:0}
.chartbox .head b{color:var(--fg);font-weight:600}
.chartbox .chips{margin-bottom:10px}
.chartbox .chip{padding:5px 11px;font-size:12px}
#chart{position:relative;min-height:220px}
#chart svg{display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.35;white-space:nowrap;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tip b{font-family:var(--num);font-size:17px;font-variant-numeric:tabular-nums}
.tip .k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.cnote{font-size:11px;color:var(--faint);margin:8px 2px 0}
.note{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:380px){.bar{grid-template-columns:86px 1fr 50px}.recs,.stats{gap:6px}}
</style>

function lerpPose(A,B,k){
  const o={};
  for(const key of ['h','hn','hf','fn','ff']) o[key]=[A[key][0]+(B[key][0]-A[key][0])*k,A[key][1]+(B[key][1]-A[key][1])*k];
  o.t=A.t+(B.t-A.t)*k; return o;
}
function poseAt(an,ms){
  const fr=an.frames, total=fr.reduce((s,f)=>s+f.d,0);
  let t=ms%total;
  for(let i=0;i<fr.length;i++){
    const B=fr[(i+1)%fr.length];
    if(t<B.d){const k=t/B.d, e=k*k*(3-2*k); return lerpPose(fr[i],B,e);}
    t-=B.d;
  }
  return fr[0];
}
function figSVG(an,p){
  const H=p.h, S=[H[0]+dir(p.t)[0]*LEN.torso,H[1]+dir(p.t)[1]*LEN.torso];
  const head=[S[0]+dir(p.t)[0]*11,S[1]+dir(p.t)[1]*11];
  const lb=an.legs||1, ab=an.arms||-1;
  const [kn,fn]=ik(H,p.fn,LEN.ul,LEN.ll,lb), [kf,ff]=ik(H,p.ff,LEN.ul,LEN.ll,an.front?-lb:lb);
  const [en,hn]=ik(S,p.hn,LEN.ua,LEN.la,an.front?1:ab), [ef,hf]=ik(S,p.hf,LEN.ua,LEN.la,an.front?-1:ab);
  const pl=(a,b,c)=>`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}L${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
  const far=an.front?'var(--fg)':'var(--faint)';
  return `${an.bar!=null?`<line x1="30" y1="${an.bar}" x2="92" y2="${an.bar}" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>`:''}
    <line x1="2" y1="110.5" x2="118" y2="110.5" stroke="var(--line)" stroke-width="2"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
      <path d="${pl(S,ef,hf)}" stroke="${far}"/><path d="${pl(H,kf,ff)}" stroke="${far}"/>
      <path d="M${H[0].toFixed(1)} ${H[1].toFixed(1)}L${S[0].toFixed(1)} ${S[1].toFixed(1)}" stroke="var(--fg)" stroke-width="8"/>
      <path d="${pl(H,kn,fn)}" stroke="var(--accent-hi)"/><path d="${pl(S,en,hn)}" stroke="var(--accent-hi)"/>
    </g>
    <circle cx="${head[0].toFixed(1)}" cy="${head[1].toFixed(1)}" r="7" fill="var(--fg)"/>`;
}
let figName=null, figT0=0, figRaf=0;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function setFig(name){ figName=ANIM[name]?name:null; figT0=performance.now(); cancelAnimationFrame(figRaf); drawFig(); }

  const el=document.getElementById('fig'); if(!el||!figName) return;

  el.innerHTML='<svg viewBox="0 0 120 120" aria-hidden="true">'+figSVG(an,poseAt(an,reduceMotion?an.frames[1].d:performance.now()-figT0))+'</svg>';

const byId = Object.fromEntries(WORKOUTS.map(w=>[w.id,w]));

function steps(w){
  const out=[];
  for(let r=1;r<=w.rounds;r++){
    w.ex.forEach((e,j)=>{
      if(e.rest){ if(!(r===w.rounds&&j===w.ex.length-1)) out.push({type:'rest',secs:e.rest,round:r}); }
      else out.push({type:'ex',name:e.n,anim:e.a||e.n,reps:e.r ?? w.byRound[r-1],unit:e.u||'',nr:!!e.nr,round:r});
    });
  }
  return out;
}
function totalReps(w){ return steps(w).filter(s=>s.type==='ex'&&!s.unit&&!s.nr).reduce((a,s)=>a+s.reps,0); }

function fmt(ms){
  const t=Math.max(0,Math.round(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

let history=[]; let col=null; let storeLabel='Guardando en este navegador';
const LS='panteon-historial';
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)||'[]'); }catch(e){ return []; } }
function lsWrite(){ try{ localStorage.setItem(LS,JSON.stringify(history)); }catch(e){} }
history = lsRead();

const ready = (async()=>{
  try{
    if(!window.claude?.use) return;
    const [db,user] = await Promise.all([claude.use('db'),claude.use('user')]);
    const uid = user ? await user.id() : null;
    if(!db || !uid) return;
    col = db.collection('data/users/'+uid);
    storeLabel='Guardado en tu cuenta';
    col.onSnapshot(snap=>{
      history = snap.docs.map(d=>({...d.data(),id:d.id}));
      render();
    }, ()=>{});
    render();
  }catch(e){}
})();

async function saveSession(s){
  await Promise.race([ready,new Promise(r=>setTimeout(r,3000))]);
  if(col){
    try{ await col.doc(s.id).set(s); return; }catch(e){}
  }
  history.push(s); lsWrite(); render();
}
async function deleteSession(id){
  if(col){ try{ await col.doc(id).delete(); return; }catch(e){} }
  history = history.filter(h=>h.id!==id); lsWrite(); render();
}
const sessionsOf = wid => history.filter(h=>h.wid===wid).sort((a,b)=>a.date.localeCompare(b.date));
const bestOf = wid => sessionsOf(wid).reduce((b,s)=>!b||s.total<b.total?s:b,null);

function spark(list){
  if(list.length<2) return '';
  const W=96,H=34,p=4, ts=list.map(s=>s.total), mx=Math.max(...ts), mn=Math.min(...ts), rg=mx-mn||1;
  const pts=ts.map((t,i)=>[p+i*(W-2*p)/(ts.length-1), p+(1-(t-mn)/rg)*(H-2*p)]); // más rápido = más abajo, igual que el gráfico
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Evolución de tiempos">
    <path d="${d} L${last[0]} ${H} L${p} ${H} Z" fill="var(--accent)" fill-opacity=".14"/>
    <path d="${d}" fill="none" stroke="var(--accent-hi)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--fg)"/></svg>`;
}

let confirmDel=null;
/* ---------- Gráfico de evolución ---------- */
const SLOTS=['var(--s1)','var(--s2)','var(--s3)'];
let chartSel=[], chartSlot={}, chartMsg='';
function chartIds(){ return WORKOUTS.filter(w=>sessionsOf(w.id).length).map(w=>w.id); }
function ensureSel(){
  const ids=chartIds();
  chartSel=chartSel.filter(id=>ids.includes(id));
  for(const k in chartSlot) if(!chartSel.includes(k)) delete chartSlot[k];
  if(!chartSel.length && ids.length){
    const top=ids.slice().sort((a,b)=>sessionsOf(b).length-sessionsOf(a).length)[0];
    chartSel=[top]; chartSlot[top]=0;
  }
}
function toggleChart(id){
  chartMsg='';
  if(chartSel.includes(id)){ if(chartSel.length>1){ chartSel=chartSel.filter(x=>x!==id); delete chartSlot[id]; } }
  else if(chartSel.length>=3) chartMsg='Podés comparar hasta 3 rutinas a la vez. Quitá una para sumar otra.';
  else { const used=Object.values(chartSlot); chartSlot[id]=[0,1,2].find(i=>!used.includes(i)); chartSel.push(id); }
  render();
}
function chartBlock(){
  ensureSel();
  const multi=chartSel.length>1;
  const chips=chartIds().map(id=>{
    const on=chartSel.includes(id);
    return `<button class="chip" aria-pressed="${on}" onclick="toggleChart('${id}')">${on?`<span class="dot" style="background:${SLOTS[chartSlot[id]]}"></span>`:''}${byId[id].name}</button>`;}).join('');
  let head;
  if(!multi){
    const l=sessionsOf(chartSel[0]), f=l[0], last=l[l.length-1], b=bestOf(chartSel[0]);
    if(l.length<2) head=`<b>${byId[chartSel[0]].name}</b>: una sola vez (${fmt(f.total)}). Con la próxima ya vas a ver la tendencia.`;
    else { const pct=Math.round((last.total/f.total-1)*100);
      head=`<b>${byId[chartSel[0]].name}</b>: de ${fmt(f.total)} a ${fmt(last.total)} · ${pct<=0?`<b style="color:var(--lv0)">${pct}%</b> más rápido que la primera vez`:`<b style="color:var(--lv1)">+${pct}%</b> respecto de la primera vez`} · récord ${fmt(b.total)}`; }
  } else head=`Cada rutina comparada con su primera vez (100%). <b>Más abajo es más rápido.</b>`;
  return `<div class="chartbox"><div class="chips" aria-label="Rutinas del gráfico">${chips}</div>
    <div class="head">${head}</div>
    <div id="chart" role="img" aria-label="Gráfico de tiempos por fecha"></div>
    <div class="cnote">${chartMsg||(multi?'Tocá un punto para ver el detalle.':'Tocá un punto para ver el detalle. Sumá otra rutina arriba para comparar (hasta 3).')}</div></div>`;
}
function niceStep(range,count){ const raw=range/count, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
let chartPts=[];
function drawChart(){
  const el=document.getElementById('chart'); if(!el) return;
  const W=Math.max(260,el.clientWidth), H=220, m={l:46,r:multi()?64:18,t:12,b:26};
  function multi(){ return chartSel.length>1; }
  const series=chartSel.map(id=>{ const l=sessionsOf(id), f=l[0].total;
    return {id, color:SLOTS[chartSlot[id]], pts:l.map(s=>({t:new Date(s.date).getTime(), v:multi()?s.total/f*100:s.total/60000, s}))}; });
  const all=series.flatMap(x=>x.pts);
  let t0=Math.min(...all.map(p=>p.t)), t1=Math.max(...all.map(p=>p.t));
  if(t1-t0<864e5){ t0-=432e5*3; t1+=432e5*3; }
  let v0=Math.min(...all.map(p=>p.v)), v1=Math.max(...all.map(p=>p.v));
  const pad=(v1-v0)*.15||(multi()?10:v1*.1||1); v0-=pad; v1+=pad;
  const st=niceStep(v1-v0,4); v0=Math.floor(v0/st)*st; v1=Math.ceil(v1/st)*st;
  const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r), Y=v=>m.t+(1-(v-v0)/(v1-v0))*(H-m.t-m.b);
  const yl=v=>multi()?Math.round(v)+'%':fmt(v*60000);
  let g='';
  for(let v=v0; v<=v1+1e-9; v+=st) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" fill="var(--faint)" font-size="11" font-family="Barlow Condensed, Arial Narrow, sans-serif">${yl(v)}</text>`;
  const fd=t=>new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short'}).replace('.','');
  const xt=[t0,(t0+t1)/2,t1];
  xt.forEach((t,i)=>g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${['start','middle','end'][i]}" fill="var(--faint)" font-size="11">${fd(t)}</text>`);
  if(multi()) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>`;
  else { const b=bestOf(chartSel[0]); if(series[0].pts.length>1) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(b.total/60000)}" y2="${Y(b.total/60000)}" stroke="var(--lv0)" stroke-dasharray="3 4" stroke-width="1"/><text x="${W-m.r}" y="${Y(b.total/60000)-6}" text-anchor="end" fill="var(--muted)" font-size="11">Récord ${fmt(b.total)}</text>`; }
  chartPts=[];
  series.forEach(se=>{
    const d=se.pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
    if(!multi()&&se.pts.length>1){ const l=se.pts[se.pts.length-1], f=se.pts[0]; g+=`<path d="${d} L${X(l.t)} ${H-m.b} L${X(f.t)} ${H-m.b} Z" fill="${se.color}" fill-opacity=".12"/>`; }
    g+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.pts.forEach((p,i)=>{ const last=i===se.pts.length-1;
      g+=`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="${last?5:4}" fill="${se.color}" stroke="var(--surface)" stroke-width="2"/>`;
      chartPts.push({x:X(p.t),y:Y(p.v),p,se}); });
    if(multi()){ const l=se.pts[se.pts.length-1]; g+=`<text x="${X(l.t)+9}" y="${Y(l.v)+4}" fill="var(--fg)" font-size="12" font-weight="600">${byId[se.id].name}</text>`; }
  });
  g+=`<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}<rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  const hit=el.querySelector('#hit'), tip=el.querySelector('#tip'), xh=el.querySelector('#xh');
  const show=ev=>{
    const r=el.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
    let best=null, bd=1e9; chartPts.forEach(c=>{ const d=Math.abs(c.x-mx)*3+Math.abs(c.y-my); if(d<bd){bd=d;best=c;} });
    if(!best) return;
    const s=best.p.s, f=sessionsOf(s.wid)[0], pct=Math.round((s.total/f.total-1)*100), pb=bestOf(s.wid).id===s.id;
    tip.innerHTML=`<span class="k" style="background:${best.se.color}"></span>${s.name} · ${fmtDate(s.date,{weekday:'short',day:'numeric',month:'short'})}<br><b>${fmt(s.total)}</b> ${pb?'<span class="crown">RÉCORD</span>':''}${s.id!==f.id?` · ${pct<=0?pct:'+'+pct}% vs 1ª vez`:' · primera vez'}`;
    tip.hidden=false;
    const tw=tip.offsetWidth; tip.style.left=Math.min(Math.max(0,best.x-tw/2),W-tw)+'px'; tip.style.top=Math.max(0,best.y-tip.offsetHeight-12)+'px';
    xh.setAttribute('x1',best.x); xh.setAttribute('x2',best.x); xh.setAttribute('visibility','visible');
  };
  hit.addEventListener('pointermove',show); hit.addEventListener('pointerdown',show);
  hit.addEventListener('pointerleave',()=>{ tip.hidden=true; xh.setAttribute('visibility','hidden'); });
}
addEventListener('resize',()=>{ if(tab==='history') drawChart(); });
function viewHistory(){
  if(!history.length) return `<div class="empty"><b>Todavía sin entrenos</b>Elegí un dios en Entrenamientos, tocá Iniciar y al terminar elegí Guardar: el tiempo queda acá con tus récords.</div>`;
  const total=history.reduce((a,s)=>a+s.total,0);
  const now=new Date(), month=history.filter(s=>{const d=new Date(s.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;
  const per = WORKOUTS.filter(w=>sessionsOf(w.id).length).map(w=>{
    const l=sessionsOf(w.id), b=bestOf(w.id), last=l[l.length-1], avg=l.reduce((a,s)=>a+s.total,0)/l.length;
    return `<div class="wh">
      <div class="n">${w.name}${lvlTag(w.level)}</div>${spark(l)||'<span></span>'}
      <div class="s">Récord <b>${fmt(b.total)}</b> el ${fmtDate(b.date,{weekday:'short',day:'numeric',month:'short'})} · Último <b>${fmt(last.total)}</b> · Promedio <b>${fmt(avg)}</b> · ${l.length} ${l.length===1?'vez':'veces'}</div>
    </div>`;}).join('');
  const log=[...history].sort((a,b)=>b.date.localeCompare(a.date)).map(s=>{
    const b=bestOf(s.wid), isPB=b&&b.id===s.id, diff=s.total-(b?b.total:s.total);
    const d=new Date(s.date);
    return `<div class="entry">
      <div class="date"><b>${d.getDate()} ${d.toLocaleDateString('es-AR',{month:'short'}).replace('.','')}</b>${d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false})}</div>
      <div><div class="en">${s.name}</div><div class="delta">${isPB?'<span class="crown">MEJOR TIEMPO</span>':`+${fmt(diff)} del récord`}</div></div>
      <div class="tm">${fmt(s.total)}</div>
      ${confirmDel===s.id
        ?`<button class="del" style="color:var(--lv2)" onclick="confirmDel=null;deleteSession('${s.id}')">¿Borrar?</button>`
        :`<button class="del" aria-label="Borrar" onclick="confirmDel='${s.id}';render()">✕</button>`}
    </div>`;}).join('');
  return `<div class="stats">
      <div class="stat"><div class="v">${history.length}</div><div class="l">entrenos</div></div>
      <div class="stat"><div class="v">${month}</div><div class="l">este mes</div></div>
      <div class="stat"><div class="v">${fmt(total)}</div><div class="l">tiempo total</div></div>
    </div>
    <div class="sec">Evolución</div>${chartBlock()}
    <div class="sec">Por entrenamiento</div><div class="list">${per}</div>
    <div class="sec">Registro</div><div class="log">${log}</div>`;
}

/* ---------- Ficha ---------- */
function openDetail(id){
  const w=byId[id], st=steps(w), l=sessionsOf(id), b=bestOf(id), last=l[l.length-1];
  const rounds=[];
  st.forEach(s=>{ (rounds[s.round-1] ||= []).push(s); });
  const rhtml = rounds.map((r,i)=>`<div class="round"><h4>Ronda ${i+1}</h4>${r.map(s=>s.type==='rest'
      ?`<div class="rest"><span>${s.secs>=60?s.secs/60+"'":s.secs+'"'}</span><span>Descanso</span></div>`
      :`<div><span>${s.reps}${s.unit}</span><span>${s.name}</span></div>`).join('')}</div>`).join('');
  $('#layer').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeLayer()">
    <div class="sheet" role="dialog" aria-label="${w.name}">
      <h2>${w.name}</h2>
      <div class="meta"><span style="color:${LEVELS[w.level].c};font-weight:600">${LEVELS[w.level].n}</span><span><b>${w.scheme}</b></span><span><b>${totalReps(w)}</b> reps</span><span><b>${st.length}</b> pasos</span></div>
      <div class="recs">
        <div class="rec"><div class="l">Récord</div><div class="v">${b?fmt(b.total):'—'}</div><div class="d">${b?fmtDate(b.date):'Primera vez'}</div></div>
        <div class="rec"><div class="l">Último</div><div class="v">${last?fmt(last.total):'—'}</div><div class="d">${last?fmtDate(last.date):'&nbsp;'}</div></div>
        <div class="rec"><div class="l">Veces</div><div class="v">${l.length}</div><div class="d">&nbsp;</div></div>
      </div>
      <div class="rounds">${rhtml}</div>
      <button class="btn" onclick="startRun('${id}')">Iniciar entrenamiento</button>
      <button class="btn ghost" onclick="closeLayer()">Volver</button>
    </div></div>`;
}
function closeLayer(){ $('#layer').innerHTML=''; }

/* ---------- Entreno ---------- */
let R=null, tick=null, audio=null, wake=null;
function beep(f=880,d=.12){
  try{ audio ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.18,audio.currentTime); g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d); o.start(); o.stop(audio.currentTime+d);
  }catch(e){}
  try{ navigator.vibrate?.(60); }catch(e){}
}
async function lockScreen(){ try{ wake = await navigator.wakeLock?.request('screen'); }catch(e){} }

function startRun(id){
  const w=byId[id];
  R={w, st:steps(w), idx:0, start:0, paused:0, pauseAt:0, stepStart:0, splits:[], phase:'count', countFrom:performance.now(), quit:false};
  beep(660); lockScreen();
  $('#layer').innerHTML=`<div class="run" id="run"><div class="run-in" id="runin"></div></div>`;
  clearInterval(tick); tick=setInterval(loop,100); loop(true);
}
const now=()=>performance.now();
function elapsed(){ if(!R.start) return 0; return (R.pauseAt||now())-R.start-R.paused; }
function stepElapsed(){ return elapsed()-R.stepStart; }

let lastCount=null;
function loop(force){
  if(!R) return;
  if(R.phase==='count'){
    const left=3-Math.floor((now()-R.countFrom)/1000);
    if(left<=0){ R.phase='go'; R.start=now(); R.stepStart=0; beep(1180,.25); paint(true); return; }
    if(left!==lastCount||force){ lastCount=left; if(!force) beep(660);
      $('#runin').innerHTML=`<div class="run-top"><span class="wname">${R.w.name}</span><button class="iconbtn" onclick="exitRun()">Cancelar</button></div>
        <div class="stage"><div class="round-l">Preparate</div><div class="count flash">${left}</div><div class="exn">${R.st[0].reps}${R.st[0].unit} ${R.st[0].name}</div></div>`; figName=null; }
    return;
  }
  const s=R.st[R.idx];
  if(s && s.type==='rest' && !R.pauseAt){
    const left=s.secs*1000-stepElapsed();
    if(left<=0){ next(); return; }
    const sec=Math.ceil(left/1000); if(sec<=3 && sec!==R.lastRestBeep){ R.lastRestBeep=sec; beep(660); }
  }
  paintClock();
}
function paintClock(){
  const t=$('#tt'), se=$('#ts'), rp=$('#reps');
  if(t) t.textContent=fmt(elapsed());
  if(se) se.textContent=fmt(stepElapsed());
  const s=R.st[R.idx];
  if(rp && s.type==='rest') rp.textContent=Math.max(0,Math.ceil((s.secs*1000-stepElapsed())/1000));
}
function paint(flash){
  const s=R.st[R.idx], nx=R.st[R.idx+1];
  const groups=[]; R.st.forEach((st,i)=>{ (groups[st.round-1] ||= []).push(`<i class="${i<R.idx?'done':i===R.idx?'now':''}"></i>`); });
  const segs=groups.map(g=>`<span class="rg" style="--n:${g.length}">${g.join('')}</span>`).join('');
  const isRest=s.type==='rest';
  $('#runin').innerHTML=`
    <div class="run-top"><span class="wname">${R.w.name}</span>
      <span style="display:flex;gap:8px"><button class="iconbtn" onclick="togglePause()">${R.pauseAt?'Seguir':'Pausa'}</button><button class="iconbtn" onclick="askQuit()">Salir</button></span></div>
    <div class="segs" aria-hidden="true">${segs}</div>
    <div class="clock"><span>Total <b id="tt">${fmt(elapsed())}</b></span><span>Ejercicio <b id="ts">${fmt(stepElapsed())}</b></span></div>
    <div class="stage ${isRest?'is-rest':''}">
      <div class="fig" id="fig" role="img" aria-label="Cómo se hace: ${isRest?'Descanso':s.name}"></div>
      <div class="round-l">Ronda ${s.round} de ${R.w.rounds} · Paso ${R.idx+1}/${R.st.length}</div>
      <div class="reps ${flash?'flash':''}" id="reps">${isRest?Math.ceil((s.secs*1000-stepElapsed())/1000):s.reps}</div>
      <div class="exn ${flash?'flash':''}">${isRest?'Descanso':(s.unit?s.unit+' ':'')+s.name}</div>
      ${R.pauseAt?'<div class="round-l" style="color:var(--lv1);margin-top:10px">En pausa</div>':''}
    </div>
    <div class="next"><div><div class="l">Después</div><div class="v">${nx?(nx.type==='rest'?`Descanso ${nx.secs}"`:`${nx.reps}${nx.unit} ${nx.name}`):'¡Terminás!'}</div></div>
      ${R.idx>0?`<button class="iconbtn" onclick="prev()">Anterior</button>`:''}</div>
    ${R.quit?`<button class="btn danger big" onclick="exitRun()">Salir sin guardar</button><button class="btn ghost" onclick="R.quit=false;paint()">Seguir entrenando</button>`
      :`<button class="btn big" onclick="next()" ${R.pauseAt?'disabled style="opacity:.4"':''}>${isRest?'Saltar descanso':nx?'Siguiente':'Terminar'}</button>`}`;
  const fk=isRest?'Descanso':s.anim; if(fk!==figName||flash||!document.getElementById('fig').innerHTML) setFig(fk); else drawFig();
}
function next(){
  if(!R||R.pauseAt) return;
  R.splits[R.idx]=stepElapsed();
  R.stepStart=elapsed(); R.lastRestBeep=null; R.idx++;
  if(R.idx>=R.st.length){ finish(); return; }
  beep(R.st[R.idx].type==='rest'?520:980); paint(true);
}
function prev(){
  if(!R||R.idx===0) return;
  R.idx--; R.stepStart=elapsed()-(R.splits[R.idx]||0); R.splits.length=R.idx; paint(true);
}
function togglePause(){
  if(R.pauseAt){ R.paused+=now()-R.pauseAt; R.pauseAt=0; } else R.pauseAt=now();
  paint();
}
function askQuit(){ R.quit=true; paint(); }
function exitRun(){ clearInterval(tick); cancelAnimationFrame(figRaf); figName=null; R=null; try{wake?.release()}catch(e){} closeLayer(); }

function finish(){
  clearInterval(tick);
  const w=R.w, total=elapsed(), prevBest=bestOf(w.id), prevList=sessionsOf(w.id), last=prevList[prevList.length-1];
  const s={id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), wid:w.id, name:w.name, date:new Date().toISOString(), total:Math.round(total), splits:R.splits.map(Math.round)};
  // tiempo por ejercicio
  const agg={}; R.st.forEach((st,i)=>{ const k=st.type==='rest'?'Descanso':st.name; agg[k]=(agg[k]||0)+(R.splits[i]||0); });
  const rows=Object.entries(agg).sort((a,b)=>b[1]-a[1]), mx=rows[0]?.[1]||1;
  let badge;
  if(!prevBest) badge=`<span class="badge good">Primera marca registrada</span>`;
  else if(total<prevBest.total) badge=`<span class="badge good">¡Nuevo récord! −${fmt(prevBest.total-total)}</span>`;
  else badge=`<span class="badge bad">+${fmt(total-prevBest.total)} de tu récord (${fmtDate(prevBest.date)})</span>`;
  const vsLast = last ? `<p class="note" style="margin-top:12px">Contra la última vez (${fmtDate(last.date,{weekday:'long',day:'numeric',month:'short'})}, ${fmt(last.total)}): ${total<last.total?`<b style="color:var(--lv0)">${fmt(last.total-total)} más rápido</b>`:`<b style="color:var(--lv1)">${fmt(total-last.total)} más lento</b>`}.</p>`:'';
  R=null; pending=s; cancelAnimationFrame(figRaf); figName=null; try{wake?.release()}catch(e){}
  beep(1320,.4);
  $('#runin').innerHTML=`<div class="fin" style="overflow:auto;flex:1;padding-top:10px">
    <h3>${w.name} completado</h3>
    <div class="total">${fmt(total)}</div>
    ${badge}${vsLast}
    <div class="sec">Tiempo por ejercicio</div>
    <div class="bars">${rows.map(([k,v])=>`<div class="bar"><span>${k}</span><span class="track"><span class="fill" style="display:block;width:${(v/mx*100).toFixed(1)}%"></span></span><span class="tv">${fmt(v)}</span></div>`).join('')}</div>
    <div id="finbtns">${finButtons(false)}</div>
  </div>`;
}
let pending=null;
function finButtons(confirming){
  return confirming
    ? `<button class="btn danger" onclick="discardRun()">Sí, descartar</button><button class="btn ghost" onclick="$('#finbtns').innerHTML=finButtons(false)">No, volver</button>`
    : `<button class="btn" onclick="keepRun()">Guardar entrenamiento</button><button class="btn ghost" onclick="$('#finbtns').innerHTML=finButtons(true)">Descartar entrenamiento</button>`;
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
async function keepRun(){
  if(!pending) return; const s=pending; pending=null;
  closeLayer(); tab='history'; render(); toast('Entrenamiento guardado');
  await saveSession(s);
}
function discardRun(){ pending=null; closeLayer(); render(); toast('Entrenamiento descartado'); }

document.addEventListener('keydown',e=>{ if(R&&R.phase==='go'&&(e.code==='Space'||e.code==='Enter')&&!R.quit&&e.target.tagName!=='BUTTON'){ e.preventDefault(); next(); } });
render();
</script>

</body></html>
